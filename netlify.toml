[build]
  command = "node scripts/build.mjs --key=$EXAMPRO_PUBLISHABLE_KEY"
  publish = "dist"

[build.environment]
  EXAMPRO_PUBLISHABLE_KEY = "sb_publishable_FAmNvES13SDqePezNexyzA_JUapzzCJ"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.supabase.co https://drive.google.com https://lh3.googleusercontent.com https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self' https://lrktftnalrtvaazaauhj.supabase.co wss://lrktftnalrtvaazaauhj.supabase.co https://www.googleapis.com https://accounts.google.com https://drive.google.com; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'"
